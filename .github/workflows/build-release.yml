name: Build & Release AngelScript Runner

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: asrun-windows-x64
            binary_name: asrun-windows-x64.exe
            build_dir: build/Release/asrun.exe
          - os: ubuntu-latest
            artifact_name: asrun-linux-x64
            binary_name: asrun-linux-x64
            build_dir: build/asrun

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake (Debug Mode)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build Executable (Debug Mode)
        run: cmake --build build --config Debug

      - name: Run AngelScript Tests & Doctest Suite
        shell: bash
        run: |
          echo "=========================================="
          echo " Running AngelScript Tests & Doctest Suite"
          echo "=========================================="
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/Debug/asrun.exe --no-pause --test
          else
            ./build/asrun --no-pause --test
          fi

      - name: Configure CMake (Release Mode)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable (Release Mode)
        run: cmake --build build --config Release

      - name: Prepare Release Binary
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/asrun.exe bin/asrun-windows-x64.exe
          else
            cp build/asrun bin/asrun-linux-x64
            chmod +x bin/asrun-linux-x64
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/${{ matrix.binary_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: asrun-windows-x64
          path: release_files

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: asrun-linux-x64
          path: release_files

      - name: Display Artifacts
        run: ls -la release_files

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_files/asrun-windows-x64.exe
            release_files/asrun-linux-x64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
